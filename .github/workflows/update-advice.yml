name: UpdateAdvice
on:
  workflow_dispatch:
  schedule:
    # weekly: new advice sheets and the links to GitHub in them
    - cron: '0 2 * * 1'

permissions:
  # to upload the product to the release taf-advice
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    # installs the packages once, then restores them from a cache
    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::TAF
          any::jsonlite
          any::curl
          any::icesVocab

    # always reads the ICES library again, starting from the advice sheets of
    # the last run (boot/previous.R), so nothing needs to be kept between
    # runs in a cache, and the dates of the files do not matter
    - name: read new advice sheets from the ICES library
      run: Rscript make.R boot
      working-directory: docs/_taf/advice

    # the site and the next run take it from there. Nothing is committed:
    # data only flow forwards.
    - name: upload the product to the release taf-advice
      working-directory: docs/_taf/advice/data
      run: |
        gh release view taf-advice > /dev/null 2>&1 ||
          gh release create taf-advice --title "TAF advice sheets" --latest=false \
            --notes "The ICES advice sheets from 2024 on and the GitHub links in them, read once a week by the UpdateAdvice workflow (docs/_taf/advice). The site and the next run take them from here."
        gh release upload taf-advice advice-sheets.csv --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
