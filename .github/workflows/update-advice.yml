name: UpdateAdvice
on:
  workflow_dispatch:
  schedule:
    # weekly: new advice sheets and the links to GitHub in them, and the
    # model scripts of the repositories pushed to during the week
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    # installs the packages once, then restores them from a cache
    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::jsonlite
          any::curl
          any::icesVocab

    - name: read new advice sheets from the ICES library
      run: Rscript _scripts/advice.R
      working-directory: docs

    # keeps the site quick to build: see docs/_scripts/status.R
    - name: read the repositories pushed to since last time
      run: Rscript _scripts/status.R
      working-directory: docs
      env:
        # needs read access to the private repositories in ices-taf
        GH_TOKEN: ${{ secrets.TAF_STATUS_TOKEN || secrets.GITHUB_TOKEN }}

    # the site picks this up at its next build
    - name: commit the data
      run: |
        git config --local user.email "github@ices.dk"
        git config --local user.name "ices-github-bot"
        git add docs/_data
        git diff --cached --quiet || git commit -m "Update advice sheets and repository data"
        git push
