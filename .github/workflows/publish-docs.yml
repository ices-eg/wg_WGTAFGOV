name: PublishDocs
on:
  workflow_dispatch:
  push:
    paths:
      - docs/**
      - .github/workflows/publish-docs.yml
    branches:
      - master
  schedule:
    # nightly, so the progress pages follow the issue tracker
    - cron: '0 3 * * *'

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    # installs the packages once, then restores them from a cache
    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::jsonlite
          any::icesVocab
          any::knitr
          any::rmarkdown
          any::plotly
          any::DT
          any::crosstalk
          any::htmltools

    - name: read issue status from GitHub
      run: Rscript _scripts/progress.R
      working-directory: docs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: read repository status from GitHub
      run: Rscript _scripts/status.R
      working-directory: docs
      env:
        # needs read access to the private repositories in ices-taf
        GH_TOKEN: ${{ secrets.TAF_STATUS_TOKEN || secrets.GITHUB_TOKEN }}

    - name: build site
      run: quarto render docs

    - name: upload site
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
